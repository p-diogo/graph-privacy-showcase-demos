[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
gas_limit = 30000000
# Ground-truth vectors and the seed lifecycle are exchanged with the Rust CLI
# through the item's build/ directory as JSON.
fs_permissions = [{ access = "read-write", path = "../../build" }]

[rpc_endpoints]
local = "${LOCAL_RPC_URL}"

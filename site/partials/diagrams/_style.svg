<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="var(--ink-subtle)"/>
  </marker>
  <marker id="arw-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="var(--brand-400)"/>
  </marker>
  <style>
    .dg { font-family: var(--font); }
    .dg-zone { fill: none; stroke: var(--line-strong); stroke-width: 1; rx: 8; }
    .dg-zone-private { stroke-dasharray: 4 4; }
    .dg-zone-graph { stroke: var(--brand-500); }
    .dg-zt { font-size: 11px; fill: var(--ink-subtle); letter-spacing: .04em; }
    .dg-zt-graph { fill: var(--brand-400); }
    .dg-box { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1; rx: 6; }
    .dg-box-graph { fill: color-mix(in srgb, var(--brand-500) 14%, transparent); stroke: var(--brand-500); }
    .dg-actor { fill: var(--panel); stroke: var(--ink-subtle); stroke-width: 1; rx: 16; }
    .dg-t { font-size: 12px; fill: var(--ink); }
    .dg-s { font-size: 10.5px; fill: var(--ink-muted); }
    .dg-line { stroke: var(--ink-subtle); stroke-width: 1.25; fill: none; marker-end: url(#arw); }
    .dg-line-b { stroke: var(--brand-400); stroke-width: 1.5; fill: none; marker-end: url(#arw-b); }
    .dg-line-d { stroke-dasharray: 4 3; }
    .dg-lt { font-size: 10px; fill: var(--ink-muted); }
    .dg-never { font-size: 11px; fill: var(--ink-muted); }
  </style>
</defs>
